name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Materialize pinned fixtures
        run: python -m moltwarden fixtures build --v0
      - name: Build and pin replay image
        run: python -m moltwarden replay-image build
      - name: Run unit, adversarial, and Docker integration tests
        run: python -m unittest discover -s tests -v
